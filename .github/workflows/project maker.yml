name: Build Project Maker APK (single file)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate the whole Android project
        run: |
          mkdir -p app/src/main/java/com/abhaya/projectmaker

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ProjectMaker'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def ksFile = rootProject.file('release.jks')
          def useKs = ksFile.exists() && System.getenv('KEYSTORE_PASSWORD') != null

          android {
              namespace 'com.abhaya.projectmaker'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.abhaya.projectmaker'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      if (useKs) {
                          storeFile ksFile
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEYSTORE_PASSWORD')
                          storeType 'pkcs12'
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig useKs ? signingConfigs.release : signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Project Maker"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/abhaya/projectmaker/MainActivity.java <<'JAVA_EOF'
          package com.abhaya.projectmaker;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.math.BigInteger;
          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.SecureRandom;
          import java.security.Signature;
          import java.security.cert.Certificate;
          import java.security.cert.CertificateFactory;
          import java.text.SimpleDateFormat;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;
          import java.util.zip.ZipOutputStream;

          public class MainActivity extends Activity {

              static final int BG = 0xFF0D1017, CARD = 0xFF171B24, CARD2 = 0xFF222836, INPUT = 0xFF1F2430;
              static final int ACCENT = 0xFF5B8CFF, GREEN = 0xFF2FBF8F, RED = 0xFFFF5C6C;
              static final int TXT = 0xFFF2F4F8, SUB = 0xFF8B93A7;
              static final int REQ_EXPORT = 1, REQ_IMPORT = 2, REQ_KEY = 3;
              static final int HOME = 0, PROJECT = 1, EDITOR = 2, KEYSTORE = 3;

              interface Str { void run(String s); }
              interface Multi { void run(String[] v); }

              FrameLayout host;
              File base, curProject, curDir, editFile, pendExport;
              EditText editor;
              boolean dirty;
              int screen;
              byte[] pendKey;

              // ------------------------------------------------------------ lifecycle

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  base = new File(getFilesDir(), "projects");
                  base.mkdirs();
                  host = new FrameLayout(this);
                  host.setBackgroundColor(BG);
                  setContentView(host);
                  showHome();
              }

              @Override
              public void onBackPressed() {
                  if (screen == EDITOR) {
                      if (dirty) {
                          new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                  .setTitle("Unsaved changes")
                                  .setPositiveButton("Save", (d, w) -> { saveEditor(); showProject(); })
                                  .setNegativeButton("Discard", (d, w) -> showProject())
                                  .setNeutralButton("Cancel", null).show();
                      } else showProject();
                  } else if (screen == KEYSTORE) {
                      if (curProject != null) showProject(); else showHome();
                  } else if (screen == PROJECT) {
                      if (!curDir.equals(curProject)) { curDir = curDir.getParentFile(); showProject(); }
                      else showHome();
                  } else super.onBackPressed();
              }

              // ------------------------------------------------------------ ui helpers

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

              GradientDrawable rr(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(r));
                  return g;
              }

              Drawable ripple(int color, int r) {
                  return new RippleDrawable(ColorStateList.valueOf(0x33FFFFFF), rr(color, r), rr(Color.WHITE, r));
              }

              TextView tv(String t, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
                  return v;
              }

              Button btn(String t, int color, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(15);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackground(ripple(color, 14));
                  b.setStateListAnimator(null);
                  b.setOnClickListener(l);
                  return b;
              }

              Button chip(String t, View.OnClickListener l) {
                  Button b = btn(t, CARD2, l);
                  b.setTextSize(13);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(dp(14), 0, dp(14), 0);
                  return b;
              }

              LinearLayout.LayoutParams lp(int w, int h, int l, int t, int r, int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.setMargins(dp(l), dp(t), dp(r), dp(b));
                  return p;
              }

              LinearLayout screen(String title, String sub) {
                  host.removeAllViews();
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.VERTICAL);
                  r.setBackgroundColor(BG);
                  r.setPadding(dp(16), dp(20), dp(16), dp(12));
                  TextView t = tv(title, 24, TXT, true);
                  t.setSingleLine(true);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  r.addView(t);
                  TextView s = tv(sub, 12, SUB, false);
                  s.setSingleLine(true);
                  s.setEllipsize(TextUtils.TruncateAt.START);
                  s.setPadding(0, dp(2), 0, dp(14));
                  r.addView(s);
                  host.addView(r, new FrameLayout.LayoutParams(-1, -1));
                  return r;
              }

              LinearLayout listArea(LinearLayout parent) {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(list, new ScrollView.LayoutParams(-1, -2));
                  parent.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  return list;
              }

              LinearLayout item(String icon, String name, String meta, View.OnClickListener c, View.OnLongClickListener lc) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(14), dp(12), dp(14), dp(12));
                  row.setBackground(ripple(CARD, 14));
                  row.setClickable(true);
                  row.setOnClickListener(c);
                  if (lc != null) row.setOnLongClickListener(lc);
                  TextView ic = tv(icon, 22, TXT, false);
                  ic.setPadding(0, 0, dp(12), 0);
                  row.addView(ic);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  TextView n = tv(name, 15, TXT, true);
                  n.setSingleLine(true);
                  n.setEllipsize(TextUtils.TruncateAt.MIDDLE);
                  col.addView(n);
                  if (meta != null && meta.length() > 0) col.addView(tv(meta, 12, SUB, false));
                  row.addView(col, new LinearLayout.LayoutParams(0, -2, 1f));
                  row.setLayoutParams(lp(-1, -2, 0, 0, 0, 8));
                  return row;
              }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }

              void ui(final String s) { runOnUiThread(() -> toast(s)); }

              EditText field(LinearLayout parent, String label, String def, int type) {
                  parent.addView(tv(label, 12, SUB, false), lp(-2, -2, 4, 0, 0, 4));
                  EditText e = new EditText(this);
                  e.setText(def);
                  e.setSingleLine(true);
                  e.setInputType(type);
                  e.setTextColor(TXT);
                  e.setTextSize(15);
                  e.setBackground(rr(INPUT, 12));
                  e.setPadding(dp(14), dp(12), dp(14), dp(12));
                  parent.addView(e, lp(-1, -2, 0, 0, 0, 12));
                  return e;
              }

              void form(String title, final String[] hints, String[] defs, final Multi cb) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(10), dp(20), 0);
                  final EditText[] es = new EditText[hints.length];
                  for (int i = 0; i < hints.length; i++) es[i] = field(box, hints[i], defs[i], InputType.TYPE_CLASS_TEXT);
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title).setView(box)
                          .setPositiveButton("OK", (d, w) -> {
                              String[] v = new String[es.length];
                              for (int i = 0; i < es.length; i++) v[i] = es[i].getText().toString().trim();
                              cb.run(v);
                          })
                          .setNegativeButton("Cancel", null).show();
              }

              void prompt(String title, String hint, String def, final Str cb) {
                  form(title, new String[]{hint}, new String[]{def}, v -> cb.run(v[0]));
              }

              void confirm(String title, String msg, final Runnable ok) {
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title).setMessage(msg)
                          .setPositiveButton("Delete", (d, w) -> ok.run())
                          .setNegativeButton("Cancel", null).show();
              }

              // ------------------------------------------------------------ home

              void showHome() {
                  screen = HOME;
                  curProject = null;
                  curDir = null;
                  LinearLayout r = screen("Project Maker", "Build Android Studio projects on your phone");

                  LinearLayout row = new LinearLayout(this);
                  row.addView(btn("＋ New project", ACCENT, v -> newProjectDialog()), lp(0, dp(52), 0, 0, 6, 0));
                  ((LinearLayout.LayoutParams) row.getChildAt(0).getLayoutParams()).weight = 1;
                  row.addView(btn("⤓ Import ZIP", GREEN, v -> pickZip()), lp(0, dp(52), 6, 0, 0, 0));
                  ((LinearLayout.LayoutParams) row.getChildAt(1).getLayoutParams()).weight = 1;
                  r.addView(row, lp(-1, -2, 0, 0, 0, 10));

                  r.addView(btn("🔑 Keystore tool (release.jks)", CARD2, v -> showKeystore()), lp(-1, dp(52), 0, 0, 0, 16));
                  r.addView(tv("PROJECTS", 12, ACCENT, true), lp(-2, -2, 4, 0, 0, 8));

                  LinearLayout list = listArea(r);
                  File[] ps = base.listFiles();
                  int n = 0;
                  if (ps != null) {
                      Arrays.sort(ps, (a, c) -> a.getName().compareToIgnoreCase(c.getName()));
                      for (final File p : ps) {
                          if (!p.isDirectory()) continue;
                          n++;
                          list.addView(item("📦", p.getName(), countFiles(p) + " files", v -> {
                              curProject = p;
                              curDir = p;
                              showProject();
                          }, v -> { projectMenu(p); return true; }));
                      }
                  }
                  if (n == 0) {
                      TextView e = tv("No projects yet.\nCreate one or import a ZIP.", 14, SUB, false);
                      e.setGravity(Gravity.CENTER);
                      e.setPadding(0, dp(40), 0, 0);
                      list.addView(e);
                  }
              }

              void projectMenu(final File p) {
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(p.getName())
                          .setItems(new String[]{"Export ZIP", "Rename", "Delete"}, (d, w) -> {
                              if (w == 0) exportZip(p);
                              else if (w == 1) prompt("Rename project", "New name", p.getName(), s -> {
                                  String nn = cleanName(s);
                                  File t = new File(base, nn);
                                  if (nn.length() == 0 || t.exists() || !p.renameTo(t)) toast("Cannot rename");
                                  showHome();
                              });
                              else confirm("Delete project?", p.getName() + " and all its files will be deleted.", () -> {
                                  deleteRec(p);
                                  showHome();
                              });
                          }).show();
              }

              String cleanName(String s) { return s.replaceAll("[^A-Za-z0-9 _.-]", "").trim(); }

              void newProjectDialog() {
                  form("New project", new String[]{"Project name", "Package name"},
                          new String[]{"My App", "com.example.myapp"}, v -> {
                              String name = cleanName(v[0]);
                              String pkg = v[1];
                              if (name.length() == 0) { toast("Enter project name"); return; }
                              if (!pkg.matches("^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$")) {
                                  toast("Invalid package (example: com.example.app)");
                                  return;
                              }
                              File dir = new File(base, name);
                              if (dir.exists()) { toast("A project with this name exists"); return; }
                              try {
                                  dir.mkdirs();
                                  createTemplate(dir, name, pkg);
                                  curProject = dir;
                                  curDir = dir;
                                  showProject();
                              } catch (Exception e) {
                                  toast("Error: " + e.getMessage());
                              }
                          });
              }

              void pickZip() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, REQ_IMPORT);
              }

              void exportZip(File p) {
                  pendExport = p;
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("application/zip");
                  i.putExtra(Intent.EXTRA_TITLE, p.getName().replace(' ', '_') + ".zip");
                  startActivityForResult(i, REQ_EXPORT);
              }

              // ------------------------------------------------------------ project browser

              String rel(File f) {
                  String a = f.getAbsolutePath(), p = curProject.getAbsolutePath();
                  String s = a.length() > p.length() ? a.substring(p.length()) : "";
                  return s.length() == 0 ? "/" : s;
              }

              boolean inside(File f) {
                  try {
                      return f.getCanonicalPath().startsWith(curProject.getCanonicalPath() + File.separator);
                  } catch (IOException e) {
                      return false;
                  }
              }

              void showProject() {
                  screen = PROJECT;
                  LinearLayout r = screen(curProject.getName(), rel(curDir));

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout bar = new LinearLayout(this);
                  bar.addView(chip("＋ File", v -> prompt("New file", "Name or path (app/src/A.java)", "", s -> createEntry(s, false))), lp(-2, dp(42), 0, 0, 8, 0));
                  bar.addView(chip("＋ Folder", v -> prompt("New folder", "Name or path", "", s -> createEntry(s, true))), lp(-2, dp(42), 0, 0, 8, 0));
                  bar.addView(chip("⤒ Export ZIP", v -> exportZip(curProject)), lp(-2, dp(42), 0, 0, 8, 0));
                  bar.addView(chip("🔑 Keystore", v -> showKeystore()), lp(-2, dp(42), 0, 0, 8, 0));
                  bar.addView(chip("🗑 Delete project", v -> confirm("Delete project?", curProject.getName(), () -> {
                      deleteRec(curProject);
                      showHome();
                  })), lp(-2, dp(42), 0, 0, 0, 0));
                  hs.addView(bar);
                  r.addView(hs, lp(-1, -2, 0, 0, 0, 12));

                  LinearLayout list = listArea(r);
                  if (!curDir.equals(curProject)) {
                      list.addView(item("↩", "..", "parent folder", v -> {
                          curDir = curDir.getParentFile();
                          showProject();
                      }, null));
                  }
                  File[] fs = curDir.listFiles();
                  if (fs != null) {
                      Arrays.sort(fs, new Comparator<File>() {
                          @Override
                          public int compare(File a, File b) {
                              if (a.isDirectory() != b.isDirectory()) return a.isDirectory() ? -1 : 1;
                              return a.getName().compareToIgnoreCase(b.getName());
                          }
                      });
                      for (final File f : fs) {
                          String meta = f.isDirectory() ? countFiles(f) + " files" : sizeStr(f.length());
                          list.addView(item(f.isDirectory() ? "📁" : fileIcon(f.getName()), f.getName(), meta, v -> {
                              if (f.isDirectory()) { curDir = f; showProject(); }
                              else showEditor(f);
                          }, v -> { entryMenu(f); return true; }));
                      }
                      if (fs.length == 0) {
                          TextView e = tv("Empty folder", 14, SUB, false);
                          e.setGravity(Gravity.CENTER);
                          e.setPadding(0, dp(40), 0, 0);
                          list.addView(e);
                      }
                  }
              }

              String fileIcon(String n) {
                  String l = n.toLowerCase(Locale.US);
                  if (l.endsWith(".java") || l.endsWith(".kt")) return "☕";
                  if (l.endsWith(".xml")) return "🧩";
                  if (l.endsWith(".gradle") || l.endsWith(".properties")) return "⚙";
                  if (l.endsWith(".yml") || l.endsWith(".yaml")) return "🚀";
                  if (l.endsWith(".jks") || l.endsWith(".keystore")) return "🔑";
                  return "📄";
              }

              String sizeStr(long b) {
                  if (b < 1024) return b + " B";
                  if (b < 1024 * 1024) return (b / 1024) + " KB";
                  return String.format(Locale.US, "%.1f MB", b / 1048576.0);
              }

              void entryMenu(final File f) {
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(f.getName())
                          .setItems(new String[]{"Rename", "Delete"}, (d, w) -> {
                              if (w == 0) prompt("Rename", "New name", f.getName(), s -> {
                                  File t = new File(f.getParentFile(), s);
                                  if (s.length() == 0 || !inside(t) || t.exists() || !f.renameTo(t)) toast("Cannot rename");
                                  showProject();
                              });
                              else confirm("Delete?", f.getName() + (f.isDirectory() ? " and everything inside it" : ""), () -> {
                                  deleteRec(f);
                                  showProject();
                              });
                          }).show();
              }

              void createEntry(String name, boolean folder) {
                  if (name.length() == 0) return;
                  File f = new File(curDir, name);
                  if (!inside(f)) { toast("Invalid path"); return; }
                  if (f.exists()) { toast("Already exists"); return; }
                  try {
                      if (folder) f.mkdirs();
                      else {
                          f.getParentFile().mkdirs();
                          f.createNewFile();
                      }
                      if (!f.getParentFile().equals(curDir) && !folder) curDir = f.getParentFile();
                      if (folder) showProject(); else showEditor(f);
                  } catch (IOException e) {
                      toast("Error: " + e.getMessage());
                  }
              }

              // ------------------------------------------------------------ editor

              void showEditor(File f) {
                  if (f.length() > 600 * 1024) { toast("File too large to edit"); return; }
                  byte[] data;
                  try {
                      data = readBytes(f);
                  } catch (IOException e) {
                      toast("Cannot read file");
                      return;
                  }
                  for (int i = 0; i < Math.min(data.length, 4000); i++) {
                      if (data[i] == 0) { toast("Binary file, cannot edit"); return; }
                  }
                  screen = EDITOR;
                  editFile = f;
                  dirty = false;
                  LinearLayout r = screen(f.getName(), rel(f));

                  LinearLayout top = new LinearLayout(this);
                  Button save = btn("Save", GREEN, v -> saveEditor());
                  top.addView(save, lp(0, dp(44), 0, 0, 6, 0));
                  ((LinearLayout.LayoutParams) save.getLayoutParams()).weight = 1;
                  Button close = btn("Close", CARD2, v -> onBackPressed());
                  top.addView(close, lp(0, dp(44), 6, 0, 0, 0));
                  ((LinearLayout.LayoutParams) close.getLayoutParams()).weight = 1;
                  r.addView(top, lp(-1, -2, 0, 0, 0, 10));

                  editor = new EditText(this);
                  editor.setText(new String(data, java.nio.charset.Charset.forName("UTF-8")));
                  editor.setTypeface(Typeface.MONOSPACE);
                  editor.setTextSize(13);
                  editor.setTextColor(TXT);
                  editor.setBackground(rr(CARD, 12));
                  editor.setPadding(dp(12), dp(12), dp(12), dp(12));
                  editor.setGravity(Gravity.TOP | Gravity.START);
                  editor.setHorizontallyScrolling(true);
                  editor.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE
                          | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  editor.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) { }
                      @Override public void onTextChanged(CharSequence s, int a, int b, int c) { dirty = true; }
                      @Override public void afterTextChanged(Editable s) { }
                  });
                  r.addView(editor, new LinearLayout.LayoutParams(-1, 0, 1f));
                  dirty = false;

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout keys = new LinearLayout(this);
                  String[] ks = {"Tab", "{", "}", "(", ")", "[", "]", ";", "<", ">", "/", "\"", "'", "=", "_"};
                  for (final String k : ks) {
                      Button c = chip(k, v -> insert(k.equals("Tab") ? "    " : k));
                      keys.addView(c, lp(dp(48), dp(40), 0, 0, 6, 0));
                  }
                  hs.addView(keys);
                  r.addView(hs, lp(-1, -2, 0, 8, 0, 0));
              }

              void insert(String t) {
                  int s = Math.max(editor.getSelectionStart(), 0), e = Math.max(editor.getSelectionEnd(), 0);
                  editor.getText().replace(Math.min(s, e), Math.max(s, e), t);
              }

              void saveEditor() {
