              String randomPass() {
                  String chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
                  SecureRandom r = new SecureRandom();
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 14; i++) sb.append(chars.charAt(r.nextInt(chars.length())));
                  return sb.toString();
              }

              void keystoreAction(final boolean toProject) {
                  final String alias = kAlias.getText().toString().trim();
                  final String pass = kPass.getText().toString();
                  final String cn = kCn.getText().toString().trim();
                  final String org = kOrg.getText().toString().trim();
                  final String ou = kOu.getText().toString().trim();
                  String cc = kCountry.getText().toString().trim().toUpperCase(Locale.US);
                  final String country = cc.length() == 2 ? cc : "";
                  int y = 25;
                  try { y = Integer.parseInt(kYears.getText().toString().trim()); } catch (Exception ex) { }
                  final int years = y < 1 ? 25 : y;
                  if (alias.length() == 0) { toast("Enter key alias"); return; }
                  if (pass.length() < 6) { toast("Password must be 6+ characters"); return; }
                  if (cn.length() == 0) { toast("Enter your name (CN)"); return; }
                  toast("Generating key...");
                  final File proj = curProject;
                  new Thread(() -> {
                      try {
                          final byte[] jks = makeKeystore(alias, pass, cn, org, ou, country, years);
                          if (toProject) {
                              put(proj, "release.jks", jks);
                              put(proj, "keystore.properties", ("storeFile=release.jks\nstorePassword=" + pass.replace("\\", "\\\\")
                                      + "\nkeyAlias=" + alias.replace("\\", "\\\\") + "\nkeyPassword=" + pass.replace("\\", "\\\\") + "\n").getBytes("UTF-8"));
                              ui("Added to project. Keep your password: " + pass);
                          } else {
                              pendKey = jks;
                              runOnUiThread(() -> {
                                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                  i.addCategory(Intent.CATEGORY_OPENABLE);
                                  i.setType("application/octet-stream");
                                  i.putExtra(Intent.EXTRA_TITLE, "release.jks");
                                  startActivityForResult(i, REQ_KEY);
                              });
                          }
                      } catch (Exception e) {
                          ui("Keystore error: " + e);
                      }
                  }).start();
              }

              byte[] makeKeystore(String alias, String pass, String cn, String org, String ou, String country, int years) throws Exception {
                  KeyPairGenerator kpg = KeyPairGenerator.getInstance("RSA");
                  kpg.initialize(2048, new SecureRandom());
                  KeyPair kp = kpg.generateKeyPair();

                  byte[] sigAlg = tlv(0x30, cat(
                          tlv(0x06, new byte[]{0x2A, (byte) 0x86, 0x48, (byte) 0x86, (byte) 0xF7, 0x0D, 0x01, 0x01, 0x0B}),
                          new byte[]{0x05, 0x00}));

                  ByteArrayOutputStream nm = new ByteArrayOutputStream();
                  if (country.length() == 2) nm.write(rdn(new byte[]{0x55, 0x04, 0x06}, country, 0x13));
                  if (org.length() > 0) nm.write(rdn(new byte[]{0x55, 0x04, 0x0A}, org, 0x0C));
                  if (ou.length() > 0) nm.write(rdn(new byte[]{0x55, 0x04, 0x0B}, ou, 0x0C));
                  nm.write(rdn(new byte[]{0x55, 0x04, 0x03}, cn, 0x0C));
                  byte[] name = tlv(0x30, nm.toByteArray());

                  long start = System.currentTimeMillis() - 86400000L;
                  Calendar cal = Calendar.getInstance(TimeZone.getTimeZone("UTC"));
                  cal.setTimeInMillis(start);
                  cal.add(Calendar.YEAR, years);
                  long end = cal.getTimeInMillis();

                  byte[] validity = tlv(0x30, cat(time(start), time(end)));
                  byte[] serial = tlv(0x02, new BigInteger(63, new SecureRandom()).add(BigInteger.ONE).toByteArray());
                  byte[] version = new byte[]{(byte) 0xA0, 0x03, 0x02, 0x01, 0x02};
                  byte[] tbs = tlv(0x30, cat(version, serial, sigAlg, name, validity, name, kp.getPublic().getEncoded()));

                  Signature sig = Signature.getInstance("SHA256withRSA");
                  sig.initSign(kp.getPrivate());
                  sig.update(tbs);
                  byte[] sigBytes = sig.sign();

                  byte[] certDer = tlv(0x30, cat(tbs, sigAlg, tlv(0x03, cat(new byte[]{0x00}, sigBytes))));
                  Certificate cert = CertificateFactory.getInstance("X.509").generateCertificate(new ByteArrayInputStream(certDer));

                  char[] pw = pass.toCharArray();
                  KeyStore ks = KeyStore.getInstance("PKCS12");
                  ks.load(null, null);
                  ks.setKeyEntry(alias, kp.getPrivate(), pw, new Certificate[]{cert});
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  ks.store(out, pw);
                  return out.toByteArray();
              }

              byte[] rdn(byte[] oid, String value, int tag) throws Exception {
                  return tlv(0x31, tlv(0x30, cat(tlv(0x06, oid), tlv(tag, value.getBytes("UTF-8")))));
              }

              byte[] time(long ms) throws Exception {
                  Calendar cal = Calendar.getInstance(TimeZone.getTimeZone("UTC"));
                  cal.setTimeInMillis(ms);
                  boolean gen = cal.get(Calendar.YEAR) >= 2050;
                  SimpleDateFormat f = new SimpleDateFormat(gen ? "yyyyMMddHHmmss'Z'" : "yyMMddHHmmss'Z'", Locale.US);
                  f.setTimeZone(TimeZone.getTimeZone("UTC"));
                  return tlv(gen ? 0x18 : 0x17, f.format(new Date(ms)).getBytes("US-ASCII"));
              }

              byte[] tlv(int tag, byte[] v) throws Exception {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  o.write(tag);
                  int l = v.length;
                  if (l < 128) o.write(l);
                  else if (l < 256) { o.write(0x81); o.write(l); }
                  else { o.write(0x82); o.write(l >> 8); o.write(l & 0xFF); }
                  o.write(v, 0, v.length);
                  return o.toByteArray();
              }

              byte[] cat(byte[]... parts) throws Exception {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  for (byte[] p : parts) o.write(p, 0, p.length);
                  return o.toByteArray();
              }

              // ------------------------------------------------------------ activity results

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  final Uri uri = data.getData();

                  if (req == REQ_EXPORT) {
                      final File p = pendExport;
                      toast("Exporting...");
                      new Thread(() -> {
                          try {
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              ZipOutputStream z = new ZipOutputStream(os);
                              zipDir(p, "", z);
                              z.finish();
                              z.close();
                              ui("ZIP exported");
                          } catch (Exception e) {
                              ui("Export failed: " + e.getMessage());
                          }
                      }).start();

                  } else if (req == REQ_KEY) {
                      final byte[] k = pendKey;
                      new Thread(() -> {
                          try {
                              OutputStream os = getContentResolver().openOutputStream(uri);
                              os.write(k);
                              os.close();
                              ui("release.jks saved. Keep your password safe.");
                          } catch (Exception e) {
                              ui("Save failed: " + e.getMessage());
                          }
                      }).start();

                  } else if (req == REQ_IMPORT) {
                      String def = displayName(uri);
                      if (def.toLowerCase(Locale.US).endsWith(".zip")) def = def.substring(0, def.length() - 4);
                      prompt("Import as new project", "Project name", cleanName(def), s -> {
                          final String name = cleanName(s);
                          if (name.length() == 0) { toast("Enter project name"); return; }
                          final File dir = new File(base, name);
                          if (dir.exists()) { toast("A project with this name exists"); return; }
                          toast("Importing...");
                          new Thread(() -> {
                              try {
                                  dir.mkdirs();
                                  InputStream in = getContentResolver().openInputStream(uri);
                                  unzip(in, dir);
                                  flattenRoot(dir);
                                  runOnUiThread(() -> {
                                      curProject = dir;
                                      curDir = dir;
                                      showProject();
                                      toast("Project imported");
                                  });
                              } catch (Exception e) {
                                  deleteRec(dir);
                                  ui("Import failed: " + e.getMessage());
                              }
                          }).start();
                      });
                  }
              }

              String displayName(Uri uri) {
                  String n = "project";
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) n = c.getString(i);
                      }
                  } catch (Exception e) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return n;
              }

              // ------------------------------------------------------------ file helpers

              void put(File dir, String path, byte[] data) throws IOException {
                  File f = new File(dir, path);
                  f.getParentFile().mkdirs();
                  FileOutputStream o = new FileOutputStream(f);
                  o.write(data);
                  o.close();
              }

              void put(File dir, String path, String text) throws IOException {
                  put(dir, path, text.getBytes("UTF-8"));
              }

              byte[] readBytes(File f) throws IOException {
                  FileInputStream in = new FileInputStream(f);
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                  in.close();
                  return o.toByteArray();
              }

              void deleteRec(File f) {
                  File[] ch = f.listFiles();
                  if (ch != null) for (File c : ch) deleteRec(c);
                  f.delete();
              }

              int countFiles(File d) {
                  File[] ch = d.listFiles();
                  if (ch == null) return 0;
                  int n = 0;
                  for (File c : ch) n += c.isDirectory() ? countFiles(c) : 1;
                  return n;
              }

              void zipDir(File dir, String prefix, ZipOutputStream z) throws IOException {
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  byte[] buf = new byte[8192];
                  for (File f : fs) {
                      String n = prefix + f.getName();
                      if (f.isDirectory()) {
                          z.putNextEntry(new ZipEntry(n + "/"));
                          z.closeEntry();
                          zipDir(f, n + "/", z);
                      } else {
                          z.putNextEntry(new ZipEntry(n));
                          FileInputStream in = new FileInputStream(f);
                          int r;
                          while ((r = in.read(buf)) > 0) z.write(buf, 0, r);
                          in.close();
                          z.closeEntry();
                      }
                  }
              }

              void unzip(InputStream in, File dest) throws IOException {
                  ZipInputStream z = new ZipInputStream(in);
                  String root = dest.getCanonicalPath() + File.separator;
                  byte[] buf = new byte[8192];
                  ZipEntry e;
                  while ((e = z.getNextEntry()) != null) {
                      File out = new File(dest, e.getName());
                      if (!out.getCanonicalPath().startsWith(root)) continue;
                      if (e.isDirectory()) out.mkdirs();
                      else {
                          out.getParentFile().mkdirs();
                          FileOutputStream fo = new FileOutputStream(out);
                          int r;
                          while ((r = z.read(buf)) > 0) fo.write(buf, 0, r);
                          fo.close();
                      }
                      z.closeEntry();
                  }
                  z.close();
              }

              // if the ZIP contains one top folder, move its contents up
              void flattenRoot(File dest) {
                  deleteRec(new File(dest, "__MACOSX"));
                  File[] ch = dest.listFiles();
                  if (ch != null && ch.length == 1 && ch[0].isDirectory()) {
                      File tmp = new File(base, ".tmp" + System.nanoTime());
                      if (!ch[0].renameTo(tmp)) return;
                      File[] kids = tmp.listFiles();
                      if (kids != null) for (File k : kids) k.renameTo(new File(dest, k.getName()));
                      deleteRec(tmp);
                  }
              }

