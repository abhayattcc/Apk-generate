name: Build Signed APK, AAB and Keystore

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Extract Project Zip"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project exists
        run: |
          if [ ! -f app/build.gradle ]; then
            echo "app/build.gradle not found. Run the extract workflow first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fix project files
        run: |
          python3 - <<'PY'
          import re, os

          # ---- app/build.gradle ----
          p = "app/build.gradle"
          s = open(p, encoding="utf-8").read().replace("\r\n", "\n")

          seen, out = set(), []
          for line in s.split("\n"):
              if line.strip().startswith("implementation") and line in seen:
                  continue
              seen.add(line)
              out.append(line)
          s = "\n".join(out)

          s = s.replace("compileSdk 34", "compileSdk 36")

          signing = (
              "android {\n"
              "\tsigningConfigs {\n"
              "\t\trelease {\n"
              "\t\t\tstoreFile file(System.getenv('KS_PATH'))\n"
              "\t\t\tstorePassword System.getenv('KS_PASS')\n"
              "\t\t\tkeyAlias System.getenv('KS_ALIAS')\n"
              "\t\t\tkeyPassword System.getenv('KEY_PASS')\n"
              "\t\t}\n"
              "\t}\n"
          )
          s = s.replace("android {", signing, 1)
          s = re.sub(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n\t\t\tsigningConfig signingConfigs.release",
              s, count=1,
          )
          assert "signingConfig signingConfigs.release" in s
          open(p, "w", encoding="utf-8").write(s)

          # ---- AndroidManifest.xml ----
          m = "app/src/main/AndroidManifest.xml"
          t = open(m, encoding="utf-8").read()
          java_dir = "app/src/main/java/com/my/SlitherArena"
          if not os.path.exists(os.path.join(java_dir, "SketchApplication.java")):
              t = re.sub(r'\s*android:name="\.SketchApplication"', "", t)
          if not os.path.exists(os.path.join(java_dir, "DebugActivity.java")):
              t = re.sub(r'<activity\s+android:name="\.DebugActivity".*?/>', "", t, flags=re.S)
          open(m, "w", encoding="utf-8").write(t)
          PY

          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "Using keystore from repository secrets."
            echo "$KS_B64" | base64 -d > "$KS"
            [ -z "$S_KPASS" ] && S_KPASS="$S_PASS"
          else
            echo "No keystore secrets found. Generating a NEW keystore."
            S_PASS="$(openssl rand -hex 12)"
            S_KPASS="$S_PASS"
            S_ALIAS="slither"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -alias "$S_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$S_PASS" -keypass "$S_KPASS" \
              -dname "CN=SlitherArena, OU=Dev, O=Dev, L=Odisha, ST=Odisha, C=IN"
            mkdir -p keystore-out
            cp "$KS" keystore-out/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$S_PASS"
              echo "keyAlias=$S_ALIAS"
              echo "keyPassword=$S_KPASS"
            } > keystore-out/credentials.txt
          fi
          echo "::add-mask::$S_PASS"
          echo "::add-mask::$S_KPASS"
          {
            echo "KS_PATH=$KS"
            echo "KS_PASS=$S_PASS"
            echo "KS_ALIAS=$S_ALIAS"
            echo "KEY_PASS=$S_KPASS"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -n 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlitherArena-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SlitherArena-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload keystore
        if: hashFiles('keystore-out/release.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SlitherArena-keystore
          path: keystore-out/
          retention-days: 7