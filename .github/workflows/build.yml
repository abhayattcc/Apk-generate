name: Build APK Signer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/apk/signer/tool

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ApkSigner'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.apk.signer.tool'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.apk.signer.tool'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../ci.jks')
                      storePassword 'android123'
                      keyAlias 'ci'
                      keyPassword 'android123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/versions/**',
                          'META-INF/MANIFEST.MF',
                          'META-INF/*.SF',
                          'META-INF/*.RSA',
                          'META-INF/*.DSA',
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*',
                          'META-INF/DEPENDENCIES',
                          'META-INF/INDEX.LIST',
                          'META-INF/*.version',
                          'META-INF/*.kotlin_module'
                      ]
                  }
              }
          }

          dependencies {
              implementation 'com.android.tools.build:apksig:8.5.2'
              implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
              implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="APK Signer"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/apk/signer/tool/MainActivity.java <<'EOF'
          package com.apk.signer.tool;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.text.InputType;
          import android.util.Base64;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.android.apksig.ApkSigner;

          import org.bouncycastle.asn1.ASN1ObjectIdentifier;
          import org.bouncycastle.asn1.DERNull;
          import org.bouncycastle.asn1.pkcs.EncryptedPrivateKeyInfo;
          import org.bouncycastle.asn1.x500.X500Name;
          import org.bouncycastle.asn1.x500.X500NameBuilder;
          import org.bouncycastle.asn1.x500.style.BCStyle;
          import org.bouncycastle.asn1.x509.AlgorithmIdentifier;
          import org.bouncycastle.cert.jcajce.JcaCertStore;
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter;
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder;
          import org.bouncycastle.cms.CMSProcessableByteArray;
          import org.bouncycastle.cms.CMSSignedData;
          import org.bouncycastle.cms.CMSSignedDataGenerator;
          import org.bouncycastle.cms.jcajce.JcaSignerInfoGeneratorBuilder;
          import org.bouncycastle.operator.ContentSigner;
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder;
          import org.bouncycastle.operator.jcajce.JcaDigestCalculatorProviderBuilder;

          import java.io.BufferedOutputStream;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FilterOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.math.BigInteger;
          import java.security.GeneralSecurityException;
          import java.security.Key;
          import java.security.KeyFactory;
          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.SecureRandom;
          import java.security.cert.CertificateFactory;
          import java.security.cert.X509Certificate;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Date;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.Locale;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;
          import java.util.zip.ZipOutputStream;

          public class MainActivity extends Activity {

              static final int RC_APK = 1, RC_AAB = 2, RC_KS = 3;

              EditText etAlias, etStorePass, etKeyPass, etCn, etOrg, etYears;
              TextView tvApk, tvAab, tvKs, tvLog;
              Button btnBuild, btnGen;

              Uri apkUri, aabUri;
              String apkName, aabName;
              byte[] ksBytes;
              String ksName;

              // ------------------------------------------------------------ UI

              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              TextView label(String s, int size, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  if (bold) t.setTypeface(null, android.graphics.Typeface.BOLD);
                  t.setPadding(0, dp(10), 0, dp(4));
                  return t;
              }

              EditText edit(String hint, String text, boolean pw) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(text);
                  e.setSingleLine(true);
                  if (pw) e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  return e;
              }

              Button button(String text, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  return b;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(16), dp(16), dp(24));
                  sv.addView(root);

                  root.addView(label("APK / AAB Signer", 22, true));

                  root.addView(label("1. Keystore details", 16, true));
                  etAlias = edit("Key alias", "release", false);
                  etStorePass = edit("Keystore password (min 6 chars)", "", true);
                  etKeyPass = edit("Key password (blank = same as keystore)", "", true);
                  etCn = edit("Name / CN (only for generating)", "Release", false);
                  etOrg = edit("Organization (optional)", "", false);
                  etYears = edit("Validity in years", "25", false);
                  etYears.setInputType(InputType.TYPE_CLASS_NUMBER);
                  root.addView(etAlias);
                  root.addView(etStorePass);
                  root.addView(etKeyPass);
                  root.addView(etCn);
                  root.addView(etOrg);
                  root.addView(etYears);
                  btnGen = button("Generate release.jks", new View.OnClickListener() {
                      public void onClick(View v) { doGenerate(); }
                  });
                  root.addView(btnGen);

                  root.addView(label("2. Choose files", 16, true));
                  root.addView(button("Choose unsigned APK", new View.OnClickListener() {
                      public void onClick(View v) { pick(RC_APK); }
                  }));
                  tvApk = label("APK: none", 13, false);
                  root.addView(tvApk);
                  root.addView(button("Choose unsigned AAB", new View.OnClickListener() {
                      public void onClick(View v) { pick(RC_AAB); }
                  }));
                  tvAab = label("AAB: none", 13, false);
                  root.addView(tvAab);
                  root.addView(button("Choose keystore (.jks / .keystore / .p12)", new View.OnClickListener() {
                      public void onClick(View v) { pick(RC_KS); }
                  }));
                  tvKs = label("Keystore: none", 13, false);
                  root.addView(tvKs);

                  root.addView(label("3. Build", 16, true));
                  btnBuild = button("START BUILD", new View.OnClickListener() {
                      public void onClick(View v) { doBuild(); }
                  });
                  root.addView(btnBuild);

                  tvLog = label("", 13, false);
                  tvLog.setTextIsSelectable(true);
                  root.addView(tvLog);

                  setContentView(sv);
              }

              void pick(int rc) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, rc);
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (res != RESULT_OK || d == null || d.getData() == null) return;
                  Uri u = d.getData();
                  String nm = nameOf(u);
                  if (rc == RC_APK) {
                      apkUri = u; apkName = nm;
                      tvApk.setText("APK: " + nm);
                  } else if (rc == RC_AAB) {
                      aabUri = u; aabName = nm;
                      tvAab.setText("AAB: " + nm);
                  } else if (rc == RC_KS) {
                      try {
                          ksBytes = readAll(u);
                          ksName = nm;
                          tvKs.setText("Keystore: " + nm);
                      } catch (Exception e) {
                          toast("Cannot read keystore: " + e.getMessage());
                      }
                  }
              }

              String nameOf(Uri u) {
                  String n = "file";
                  Cursor c = getContentResolver().query(u, null, null, null, null);
                  if (c != null) {
                      try {
                          if (c.moveToFirst()) {
                              int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              if (idx >= 0) n = c.getString(idx);
                          }
                      } finally { c.close(); }
                  }
                  return n;
              }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }

              void log(final String s) {
                  runOnUiThread(new Runnable() {
                      public void run() { tvLog.append(s + "\n"); }
                  });
              }

              static String t(EditText e) { return e.getText().toString().trim(); }

              byte[] readAll(Uri u) throws IOException {
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) bo.write(buf, 0, r);
                      return bo.toByteArray();
                  }
              }

              void copyUri(Uri u, File f) throws IOException {
                  try (InputStream in = getContentResolver().openInputStream(u);
                       OutputStream o = new FileOutputStream(f)) {
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                  }
              }

              // ------------------------------------------------------ Output

              void saveToDownloads(byte[] data, String relDir, String name, String mime) throws IOException {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + relDir);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (u == null) throw new IOException("Cannot create " + name);
                  try (OutputStream o = getContentResolver().openOutputStream(u)) {
                      o.write(data);
                  }
              }

              void saveFileToDownloads(File f, String relDir, String name, String mime) throws IOException {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + relDir);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (u == null) throw new IOException("Cannot create " + name);
                  try (OutputStream o = getContentResolver().openOutputStream(u);
                       InputStream in = new java.io.FileInputStream(f)) {
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                  }
              }

              static String stamp() {
                  return new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
              }

              // ----------------------------------------------- Generate keystore

              void doGenerate() {
                  final String alias = t(etAlias);
                  final String sp = etStorePass.getText().toString();
                  final String kp0 = etKeyPass.getText().toString();
                  final String kp = kp0.isEmpty() ? sp : kp0;
                  final String cn = t(etCn);
                  final String org = t(etOrg);
                  int y = 25;
                  try { y = Integer.parseInt(t(etYears)); } catch (Exception ignored) { }
                  final int years = Math.max(1, y);
                  if (alias.isEmpty() || sp.length() < 6 || kp.length() < 6) {
                      toast("Alias required, passwords need at least 6 characters");
                      return;
                  }
                  btnGen.setEnabled(false);
                  log("Generating keystore...");
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
                              g.initialize(2048, new SecureRandom());
                              KeyPair kpair = g.generateKeyPair();
                              X500NameBuilder nb = new X500NameBuilder(BCStyle.INSTANCE);
                              nb.addRDN(BCStyle.CN, cn.isEmpty() ? "Release" : cn);
                              if (!org.isEmpty()) nb.addRDN(BCStyle.O, org);
                              X500Name name = nb.build();
                              Date from = new Date(System.currentTimeMillis() - 60000L);
                              Date to = new Date(from.getTime() + years * 365L * 86400000L);
                              JcaX509v3CertificateBuilder cb = new JcaX509v3CertificateBuilder(
                                      name, BigInteger.valueOf(System.currentTimeMillis()), from, to, name, kpair.getPublic());
                              ContentSigner cs = new JcaContentSignerBuilder("SHA256withRSA").build(kpair.getPrivate());
                              X509Certificate cert = new JcaX509CertificateConverter().getCertificate(cb.build(cs));
                              byte[] jks = Jks.write(alias, sp, kp, kpair.getPrivate().getEncoded(), cert);
                              String folder = "ApkSigner/keystore_" + stamp();
                              saveToDownloads(jks, folder, "release.jks", "application/octet-stream");
                              ksBytes = jks;
                              ksName = "release.jks";
                              runOnUiThread(new Runnable() {
                                  public void run() { tvKs.setText("Keystore: release.jks (generated)"); }
                              });
                              log("Saved: Download/" + folder + "/release.jks");
                              log("Alias: " + alias + "  (keep your passwords safe!)");
                          } catch (Throwable e) {
                              log("ERROR: " + e);
                          } finally {
                              runOnUiThread(new Runnable() {
                                  public void run() { btnGen.setEnabled(true); }
                              });
                          }
                      }
                  }).start();
              }

              // ------------------------------------------------------- Build

              void doBuild() {
                  if (apkUri == null && aabUri == null) { toast("Choose an APK or AAB first"); return; }
                  if (ksBytes == null) { toast("Choose or generate a keystore first"); return; }
                  final String alias = t(etAlias);
                  final String sp = etStorePass.getText().toString();
                  final String kp0 = etKeyPass.getText().toString();
                  final String kp = kp0.isEmpty() ? sp : kp0;
                  if (sp.isEmpty()) { toast("Enter keystore password"); return; }
                  btnBuild.setEnabled(false);
                  tvLog.setText("");
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              log("Loading keystore...");
                              Cred cred = loadCred(ksBytes, sp, kp, alias);
                              X509Certificate cert = cred.chain.get(0);
                              log("Signer: " + cert.getSubjectX500Principal().getName());

                              File work = new File(getCacheDir(), "work");
                              deleteRec(work);
                              work.mkdirs();
                              String folder = "ApkSigner/build_" + stamp();

                              if (apkUri != null) {
                                  log("Signing APK: " + apkName);
                                  File in = new File(work, "in.apk");
                                  File aligned = new File(work, "aligned.apk");
                                  File out = new File(work, "signed.apk");
                                  copyUri(apkUri, in);
                                  log("Aligning...");
                                  zipAlign(in, aligned);
                                  log("Signing (v1 + v2 + v3)...");
                                  ApkSigner.SignerConfig sc = new ApkSigner.SignerConfig.Builder(
                                          "signer", cred.key, cred.chain).build();
                                  new ApkSigner.Builder(Collections.singletonList(sc))
                                          .setInputApk(aligned)
                                          .setOutputApk(out)
                                          .setV1SigningEnabled(true)
                                          .setV2SigningEnabled(true)
                                          .setV3SigningEnabled(true)
                                          .setCreatedBy("APK Signer")
                                          .build()
                                          .sign();
                                  saveFileToDownloads(out, folder, "signed.apk", "application/vnd.android.package-archive");
                                  log("signed.apk done");
                              }

                              if (aabUri != null) {
                                  log("Signing AAB: " + aabName);
                                  File in = new File(work, "in.aab");
                                  File out = new File(work, "signed.aab");
                                  copyUri(aabUri, in);
                                  signAab(in, out, cred.key, cred.chain);
                                  saveFileToDownloads(out, folder, "signed.aab", "application/octet-stream");
                                  log("signed.aab done");
                              }

                              String ksOut = Jks.isJks(ksBytes) ? "release.jks" : (ksName == null ? "release.keystore" : ksName);
                              saveToDownloads(ksBytes, folder, ksOut, "application/octet-stream");
                              log("Keystore copy: " + ksOut);
                              log("");
                              log("DONE. Output folder: Download/" + folder + "/");
                              deleteRec(work);
                          } catch (Throwable e) {
                              log("ERROR: " + e);
                          } finally {
                              runOnUiThread(new Runnable() {
                                  public void run() { btnBuild.setEnabled(true); }
                              });
                          }
                      }
                  }).start();
              }

              static void deleteRec(File f) {
                  if (f.isDirectory()) {
                      File[] c = f.listFiles();
                      if (c != null) for (File x : c) deleteRec(x);
                  }
                  f.delete();
              }

              // -------------------------------------------------- Credentials

              static class Cred {
                  PrivateKey key;
                  List<X509Certificate> chain = new ArrayList<X509Certificate>();
              }

              static Cred loadCred(byte[] data, String sp, String kp, String alias) throws Exception {
                  if (Jks.isJks(data)) return Jks.load(data, sp, kp, alias);
                  KeyStore ks = KeyStore.getInstance("PKCS12");
                  ks.load(new ByteArrayInputStream(data), sp.toCharArray());
                  if (alias.isEmpty()) {
                      Enumeration<String> en = ks.aliases();
                      while (en.hasMoreElements()) {
                          String a = en.nextElement();
                          if (ks.isKeyEntry(a)) { alias = a; break; }
                      }
                  }
                  Key k = ks.getKey(alias, kp.toCharArray());
                  if (!(k instanceof PrivateKey)) throw new GeneralSecurityException("No private key for alias: " + alias);
                  java.security.cert.Certificate[] ch = ks.getCertificateChain(alias);
                  if (ch == null || ch.length == 0) throw new GeneralSecurityException("No certificate chain");
                  Cred c = new Cred();
                  c.key = (PrivateKey) k;
                  for (java.security.cert.Certificate x : ch) c.chain.add((X509Certificate) x);
                  return c;
              }

              // ---------------------------------------------------- JKS format

              static class Jks {
                  static final String SALT_MAGIC = "Mighty Aphrodite";

                  static boolean isJks(byte[] d) {
                      return d != null && d.length > 32
                              && (d[0] & 0xff) == 0xFE && (d[1] & 0xff) == 0xED
                              && (d[2] & 0xff) == 0xFE && (d[3] & 0xff) == 0xED;
                  }

                  static byte[] pw(String s) {
                      byte[] b = new byte[s.length() * 2];
                      for (int i = 0; i < s.length(); i++) {
                          char c = s.charAt(i);
                          b[2 * i] = (byte) (c >> 8);
                          b[2 * i + 1] = (byte) c;
                      }
                      return b;
                  }

                  static byte[] xor(byte[] pwb, byte[] salt, byte[] data) throws GeneralSecurityException {
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      byte[] out = new byte[data.length];
                      byte[] digest = salt;
                      int pos = 0;
                      while (pos < data.length) {
                          md.update(pwb);
                          md.update(digest);
                          digest = md.digest();
                          int n = Math.min(20, data.length - pos);
                          for (int i = 0; i < n; i++) out[pos + i] = (byte) (data[pos + i] ^ digest[i]);
                          pos += n;
                      }
                      return out;
                  }

                  static byte[] protect(String kpass, byte[] pkcs8) throws Exception {
                      byte[] salt = new byte[20];
                      new SecureRandom().nextBytes(salt);
                      byte[] pwb = pw(kpass);
                      byte[] enc = xor(pwb, salt, pkcs8);
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      md.update(pwb);
                      md.update(pkcs8);
                      byte[] chk = md.digest();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      bo.write(salt);
                      bo.write(enc);
                      bo.write(chk);
                      return new EncryptedPrivateKeyInfo(
                              new AlgorithmIdentifier(new ASN1ObjectIdentifier("1.3.6.1.4.1.42.2.17.1.1"), DERNull.INSTANCE),
                              bo.toByteArray()).getEncoded();
                  }

                  static byte[] recover(String kpass, byte[] epki) throws Exception {
                      EncryptedPrivateKeyInfo e = EncryptedPrivateKeyInfo.getInstance(epki);
                      byte[] all = e.getEncryptedData();
                      if (all.length < 41) throw new GeneralSecurityException("Bad key entry");
                      byte[] salt = Arrays.copyOfRange(all, 0, 20);
                      byte[] enc = Arrays.copyOfRange(all, 20, all.length - 20);
                      byte[] chk = Arrays.copyOfRange(all, all.length - 20, all.length);
                      byte[] pwb = pw(kpass);
                      byte[] plain = xor(pwb, salt, enc);
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      md.update(pwb);
                      md.update(plain);
                      if (!MessageDigest.isEqual(md.digest(), chk))
                          throw new GeneralSecurityException("Wrong key password");
                      return plain;
                  }

                  static byte[] write(String alias, String sp, String kp, byte[] pkcs8, X509Certificate cert) throws Exception {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      DataOutputStream o = new DataOutputStream(bo);
                      o.writeInt(0xFEEDFEED);
                      o.writeInt(2);
                      o.writeInt(1);
                      o.writeInt(1);
                      o.writeUTF(alias.toLowerCase(Locale.ROOT));
                      o.writeLong(System.currentTimeMillis());
                      byte[] enc = protect(kp, pkcs8);
                      o.writeInt(enc.length);
                      o.write(enc);
                      o.writeInt(1);
                      o.writeUTF("X.509");
                      byte[] cb = cert.getEncoded();
                      o.writeInt(cb.length);
                      o.write(cb);
                      o.flush();
                      byte[] body = bo.toByteArray();
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      md.update(pw(sp));
                      md.update(SALT_MAGIC.getBytes("UTF-8"));
                      md.update(body);
                      byte[] dig = md.digest();
                      byte[] res = new byte[body.length + dig.length];
                      System.arraycopy(body, 0, res, 0, body.length);
                      System.arraycopy(dig, 0, res, body.length, dig.length);
                      return res;
                  }

                  static PrivateKey toKey(byte[] pkcs8) throws Exception {
                      Exception last = null;
                      for (String alg : new String[]{"RSA", "EC", "DSA"}) {
                          try {
                              return KeyFactory.getInstance(alg).generatePrivate(new PKCS8EncodedKeySpec(pkcs8));
                          } catch (Exception e) { last = e; }
                      }
                      throw last;
                  }

                  static Cred load(byte[] d, String sp, String kp, String alias) throws Exception {
                      int end = d.length - 20;
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      md.update(pw(sp));
                      md.update(SALT_MAGIC.getBytes("UTF-8"));
                      md.update(d, 0, end);
                      if (!MessageDigest.isEqual(md.digest(), Arrays.copyOfRange(d, end, d.length)))
                          throw new GeneralSecurityException("Wrong keystore password or corrupt keystore");
                      DataInputStream in = new DataInputStream(new ByteArrayInputStream(d, 0, end));
                      in.readInt();
                      int ver = in.readInt();
                      int n = in.readInt();
                      CertificateFactory cf = CertificateFactory.getInstance("X.509");
                      for (int i = 0; i < n; i++) {
                          int tag = in.readInt();
                          String a = in.readUTF();
                          in.readLong();
                          if (tag == 1) {
                              byte[] enc = new byte[in.readInt()];
                              in.readFully(enc);
                              int nc = in.readInt();
                              List<X509Certificate> chain = new ArrayList<X509Certificate>();
                              for (int j = 0; j < nc; j++) {
                                  if (ver == 2) in.readUTF();
                                  byte[] cb = new byte[in.readInt()];
                                  in.readFully(cb);
                                  chain.add((X509Certificate) cf.generateCertificate(new ByteArrayInputStream(cb)));
                              }
                              if (alias.isEmpty() || a.equalsIgnoreCase(alias)) {
                                  Cred c = new Cred();
                                  c.key = toKey(recover(kp, enc));
                                  c.chain = chain;
                                  return c;
                              }
                          } else if (tag == 2) {
                              if (ver == 2) in.readUTF();
                              byte[] cb = new byte[in.readInt()];
                              in.readFully(cb);
                          } else {
                              throw new GeneralSecurityException("Bad keystore entry");
                          }
                      }
                      throw new GeneralSecurityException("Alias not found: " + alias);
                  }
              }

              // ------------------------------------------------------ Zip align

              static class CountOut extends FilterOutputStream {
                  long n;
                  CountOut(OutputStream o) { super(o); }
                  @Override public void write(int b) throws IOException { out.write(b); n++; }
                  @Override public void write(byte[] b, int o, int l) throws IOException { out.write(b, o, l); n += l; }
              }

              static void zipAlign(File in, File out) throws IOException {
                  try (ZipFile zf = new ZipFile(in);
                       CountOut co = new CountOut(new BufferedOutputStream(new FileOutputStream(out)));
                       ZipOutputStream zos = new ZipOutputStream(co)) {
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      byte[] buf = new byte[65536];
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          String name = e.getName();
                          ZipEntry ne = new ZipEntry(name);
                          if (e.getTime() != -1) ne.setTime(e.getTime());
                          if (e.getMethod() == ZipEntry.STORED && !e.isDirectory()) {
                              ne.setMethod(ZipEntry.STORED);
                              ne.setSize(e.getSize());
                              ne.setCompressedSize(e.getSize());
                              ne.setCrc(e.getCrc());
                              int align = name.endsWith(".so") ? 16384 : 4;
                              long ds = co.n + 30 + name.getBytes("UTF-8").length;
                              int rem = (int) ((align - (ds % align)) % align);
                              if (rem != 0) {
                                  int len = rem >= 4 ? rem : rem + align;
                                  byte[] ex = new byte[len];
                                  ex[0] = (byte) 0x35;
                                  ex[1] = (byte) 0xD9;
                                  ex[2] = (byte) ((len - 4) & 0xff);
                                  ex[3] = (byte) (((len - 4) >> 8) & 0xff);
                                  ne.setExtra(ex);
                              }
                          }
                          zos.putNextEntry(ne);
                          if (!e.isDirectory()) {
                              try (InputStream is = zf.getInputStream(e)) {
                                  int r;
                                  while ((r = is.read(buf)) > 0) zos.write(buf, 0, r);
                              }
                          }
                          zos.closeEntry();
                      }
                  }
              }

              // ------------------------------------------------------- AAB sign

              static boolean skipEntry(String n) {
                  if (n.equals("META-INF/MANIFEST.MF")) return true;
                  if (n.startsWith("META-INF/")) {
                      String u = n.toUpperCase(Locale.ROOT);
                      return u.endsWith(".SF") || u.endsWith(".RSA") || u.endsWith(".DSA") || u.endsWith(".EC");
                  }
                  return false;
              }

              static void wrapLine(StringBuilder sb, String line) {
                  int pos = 0;
                  boolean first = true;
                  while (line.length() - pos > (first ? 72 : 71)) {
                      int n = first ? 72 : 71;
                      if (!first) sb.append(' ');
                      sb.append(line, pos, pos + n).append("\r\n");
                      pos += n;
                      first = false;
                  }
                  if (!first) sb.append(' ');
                  sb.append(line.substring(pos)).append("\r\n");
              }

              static String section(String name, String b64) {
                  StringBuilder sb = new StringBuilder();
                  wrapLine(sb, "Name: " + name);
                  sb.append("SHA-256-Digest: ").append(b64).append("\r\n\r\n");
                  return sb.toString();
              }

              static String b64(byte[] b) { return Base64.encodeToString(b, Base64.NO_WRAP); }

              static void signAab(File in, File out, PrivateKey key, List<X509Certificate> chain) throws Exception {
                  String alg = key.getAlgorithm();
                  String sigAlg = "SHA256withRSA", ext = "RSA";
                  if ("EC".equalsIgnoreCase(alg)) { sigAlg = "SHA256withECDSA"; ext = "EC"; }
                  else if ("DSA".equalsIgnoreCase(alg)) { sigAlg = "SHA256withDSA"; ext = "DSA"; }

                  MessageDigest sha = MessageDigest.getInstance("SHA-256");
                  StringBuilder mf = new StringBuilder("Manifest-Version: 1.0\r\nCreated-By: 1.0 (Android Signer)\r\n\r\n");
                  List<String> names = new ArrayList<String>();
                  List<String> secs = new ArrayList<String>();
                  byte[] buf = new byte[65536];

                  try (ZipFile zf = new ZipFile(in)) {
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          String n = e.getName();
                          if (e.isDirectory() || skipEntry(n)) continue;
                          sha.reset();
                          try (InputStream is = zf.getInputStream(e)) {
                              int r;
                              while ((r = is.read(buf)) > 0) sha.update(buf, 0, r);
                          }
                          String sec = section(n, b64(sha.digest()));
                          names.add(n);
                          secs.add(sec);
                          mf.append(sec);
                      }
                  }
                  byte[] mfBytes = mf.toString().getBytes("UTF-8");

                  StringBuilder sf = new StringBuilder("Signature-Version: 1.0\r\nCreated-By: 1.0 (Android Signer)\r\n");
                  sf.append("SHA-256-Digest-Manifest: ").append(b64(sha.digest(mfBytes))).append("\r\n\r\n");
                  for (int i = 0; i < names.size(); i++) {
                      sf.append(section(names.get(i), b64(sha.digest(secs.get(i).getBytes("UTF-8")))));
                  }
                  byte[] sfBytes = sf.toString().getBytes("UTF-8");

                  CMSSignedDataGenerator gen = new CMSSignedDataGenerator();
                  ContentSigner cs = new JcaContentSignerBuilder(sigAlg).build(key);
                  gen.addSignerInfoGenerator(new JcaSignerInfoGeneratorBuilder(
                          new JcaDigestCalculatorProviderBuilder().build()).build(cs, chain.get(0)));
                  gen.addCertificates(new JcaCertStore(chain));
                  CMSSignedData sd = gen.generate(new CMSProcessableByteArray(sfBytes), false);
                  byte[] sigBlock = sd.getEncoded();

                  try (ZipFile zf = new ZipFile(in);
                       ZipOutputStream zos = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(out)))) {
                      zos.putNextEntry(new ZipEntry("META-INF/MANIFEST.MF"));
                      zos.write(mfBytes);
                      zos.closeEntry();
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          String n = e.getName();
                          if (e.isDirectory() || skipEntry(n)) continue;
                          ZipEntry ne = new ZipEntry(n);
                          if (e.getTime() != -1) ne.setTime(e.getTime());
                          zos.putNextEntry(ne);
                          try (InputStream is = zf.getInputStream(e)) {
                              int r;
                              while ((r = is.read(buf)) > 0) zos.write(buf, 0, r);
                          }
                          zos.closeEntry();
                      }
                      zos.putNextEntry(new ZipEntry("META-INF/CERT.SF"));
                      zos.write(sfBytes);
                      zos.closeEntry();
                      zos.putNextEntry(new ZipEntry("META-INF/CERT." + ext));
                      zos.write(sigBlock);
                      zos.closeEntry();
                  }
              }
          }
          EOF

      - name: Create CI signing key for this app
        run: |
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android123 -keypass android123 \
            -storetype JKS -dname "CN=ApkSigner CI"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApkSigner-release
          path: app/build/outputs/apk/release/*.apk